name: validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-tfda.txt
      - run: python -m pip install -r tools/requirements-tfda.txt
      - name: Validate TFDA acquisition and frozen inventory offline
        run: python -m unittest discover -s tests -p 'test_tfda_*.py'
      - run: npm ci
      - run: npm run typecheck
      - name: Validate cloud deployment configuration offline
        shell: pwsh
        run: ./tools/check-deployment.ps1
      - name: Validate Firebase Hosting configuration offline
        shell: pwsh
        run: ./tools/check-hosting.ps1
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run check:lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
