name: isolated-safari-synthetic-file-fixture

on:
  push:
    branches:
      - codex/safari-file-fixture-20261024
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-file-matrix:
    name: Native Safari synthetic file controls
    runs-on: macos-15
    timeout-minutes: 20
    env:
      APP_MODE: local
      AI_PROVIDER: nvidia
      OPENAI_API_KEY: ''
      NVIDIA_API_KEY: ''
      PORT: '5190'
      LOCAL_DATA_PATH: .local/e2e-run-safari-file-fixture
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SAFARI_OUTPUT: artifacts/safari-file-fixture
      APPLICATION_BASE_SHA: 7ffee6529b1a463ded6d229b8f45771de22af52f
      PROBE_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify isolated probe source and parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PROBE_SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$APPLICATION_BASE_SHA"
          python3 - <<'PY'
          import os, subprocess
          base = os.environ["APPLICATION_BASE_SHA"]
          paths = set(subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          expected = {"tools/check-safari-file-fixture.py", ".github/workflows/desktop-browsers.yml"}
          if paths != expected:
              raise SystemExit("Probe source must replace only its existing QA workflow and add its diagnostic tool")
          PY
      - run: npm ci
      - name: Build unchanged application with Node egress guard
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tests/support/loopback-network-guard.cjs
          YZT_BATCH2_NETWORK_LOG: ${{ github.workspace }}/artifacts/safari-file-fixture/node-network.jsonl
        run: |
          set -euo pipefail
          mkdir -p "$SAFARI_OUTPUT"
          npm run build
          if [ -s "$YZT_BATCH2_NETWORK_LOG" ]; then
            echo 'Application build attempted non-loopback network access'
            exit 1
          fi
      - name: Record native platform identity
        run: |
          {
            sw_vers
            uname -m
            /usr/bin/safaridriver --version
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/Safari.app/Contents/Info.plist
          } > "$SAFARI_OUTPUT/platform.txt"
      - name: Enable WebDriver only in this ephemeral macOS runner
        run: sudo /usr/bin/safaridriver --enable
      - name: Run bounded native file matrix without fallback or AI
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tests/support/loopback-network-guard.cjs
          YZT_BATCH2_NETWORK_LOG: ${{ github.workspace }}/artifacts/safari-file-fixture/node-network.jsonl
        run: |
          set -euo pipefail
          node --import tsx tests/support/e2e-server.ts > "$SAFARI_OUTPUT/application.log" 2>&1 &
          app_pid=$!
          /usr/bin/safaridriver -p 9515 > "$SAFARI_OUTPUT/driver.log" 2>&1 &
          driver_pid=$!
          trap 'kill "$app_pid" "$driver_pid" 2>/dev/null || true' EXIT
          set +e
          python3 tools/check-safari-file-fixture.py --base-url http://127.0.0.1:5190 --driver-url http://127.0.0.1:9515 --source-sha "$PROBE_SOURCE_SHA" --output "$SAFARI_OUTPUT"
          probe_status=$?
          set -e
          if [ -s "$YZT_BATCH2_NETWORK_LOG" ]; then
            echo 'Application attempted non-loopback network access'
            exit 1
          fi
          exit "$probe_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-file-fixture-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/safari-file-fixture/
          if-no-files-found: error

